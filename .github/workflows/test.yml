name: CPU integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install gradio==4.40.0 'huggingface_hub<1' 'numpy<2' Pillow
      - run: python tests/fetch_upstream.py upstream
      - run: python -m unittest discover -s tests -v
        env:
          KREA_SHIFT_TEST_SOURCE: upstream
          GRADIO_ANALYTICS_ENABLED: 'False'
